name: Docker Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  # Detect which apps changed so we only validate those
  changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'validate')
    outputs:
      apps: ${{ steps.compute.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bunkbot:
              - 'src/bunkbot/**'
              - 'src/shared/**'
            covabot:
              - 'src/covabot/**'
              - 'src/shared/**'
            djcova:
              - 'src/djcova/**'
              - 'src/shared/**'
            bluebot:
              - 'src/bluebot/**'
              - 'src/shared/**'
      - name: Compute app matrix
        id: compute
        run: |
          APPS=()
          [[ "${{ steps.filter.outputs.bunkbot }}" == "true" ]] && APPS+=("bunkbot")
          [[ "${{ steps.filter.outputs.covabot }}" == "true" ]] && APPS+=("covabot")
          [[ "${{ steps.filter.outputs.djcova }}"  == "true" ]] && APPS+=("djcova")
          [[ "${{ steps.filter.outputs.bluebot }}" == "true" ]] && APPS+=("bluebot")

          # If no app source changed, validate all — the user explicitly requested validation
          if [ ${#APPS[@]} -eq 0 ]; then
            APPS=(bunkbot covabot djcova bluebot)
            echo "::notice::No app source changes detected; validating all apps because the 'validate' label is present."
          fi

          APPS_JSON=$(printf '%s\n' "${APPS[@]}" | jq -R . | jq -sc .)
          echo "apps=$APPS_JSON" >> $GITHUB_OUTPUT

  docker_validation:
    name: Docker Build & Validate — ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: changes
    if: contains(github.event.pull_request.labels.*.name, 'validate')
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared and app
        run: npm run build:shared && npm run "build:${{ matrix.app }}"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Docker build
        run: |
          APP=${{ matrix.app }}
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${APP}"
          docker build -f ./src/${APP}/Dockerfile.ci -t ${IMAGE}:test .
          
      - name: Run container and health check
        run: |
          APP=${{ matrix.app }}
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${APP}:test"
          docker run -d --name ${APP}-test \
            -e DISCORD_TOKEN=test \
            -e DEBUG_MODE=true \
            -e CI_SMOKE_MODE=true \
            -e CI=true \
            -e NODE_ENV=test \
            -e METRICS_PORT=3000 \
            $IMAGE
          
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' ${APP}-test)" != "true" ]; then
            echo "Container ${APP}-test crashed!"
            docker logs ${APP}-test
            exit 1
          fi
